<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lang Learn" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="preload" as="image" href="/icons/logo-128.png?v=2" />
    <style>
      /* The splash paints before any app CSS loads, so its colours are the --bg tokens written out. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f4f5f7; transition: opacity 240ms cubic-bezier(0.2, 0, 0, 1); }
      #splash.is-done { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #splash { background: #0f1114; } }
      html[data-theme="dark"] #splash { background: #0f1114; }
    </style>
    <!-- Fonts load in parallel with the app (not chained behind its CSS) and never block the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800&display=swap"
    />
    <title>Lang Learn</title>
  </head>
  <body>
    <!-- The image shows the finished mark until the app script turns the element into the animated loader. -->
    <div id="splash">
      <logo-splash-loader size="112" aria-label="Lang Learn"><img src="/icons/splash-mark.png" width="112" height="112" alt="" /></logo-splash-loader>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
